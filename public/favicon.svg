<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1e3a5f" />
  <!-- Globe outline -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-width="2.5" />
  <!-- Horizontal equator line -->
  <ellipse cx="32" cy="32" rx="18" ry="6" fill="none" stroke="#ffffff" stroke-width="2" />
  <!-- Vertical meridian line -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#ffffff" stroke-width="2" />
  <!-- Top and bottom caps -->
  <line x1="14" y1="32" x2="50" y2="32" stroke="#ffffff" stroke-width="2" />
  <!-- Orbit ring (tilted ellipse around globe) -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 2" transform="rotate(-30 32 32)" />
</svg>
